# Optional host-side observability stack.
# The simplified Slack/Tavily/GitHub example only needs a host process when
# optional telemetry is enabled.

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
