version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /sandbox/.hermes
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
  - /sandbox/.hermes-data
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  nvidia:
    name: nvidia
    endpoints:
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: POST, path: /v1/chat/completions }
      - allow: { method: POST, path: /v1/completions }
      - allow: { method: POST, path: /v1/embeddings }
      - allow: { method: GET, path: /v1/models }
      - allow: { method: GET, path: /v1/models/** }
    - host: inference-api.nvidia.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: POST, path: /v1/chat/completions }
      - allow: { method: POST, path: /v1/completions }
      - allow: { method: POST, path: /v1/embeddings }
      - allow: { method: GET, path: /v1/models }
      - allow: { method: GET, path: /v1/models/** }
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/local/bin/hermes
    - path: /usr/bin/python3.11
  slack:
    name: slack
    endpoints:
    - host: slack.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow: { method: GET, path: /** }
      - allow: { method: POST, path: /** }
    - host: api.slack.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow: { method: GET, path: /** }
      - allow: { method: POST, path: /** }
    - host: hooks.slack.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow: { method: GET, path: /** }
      - allow: { method: POST, path: /** }
    - host: wss-primary.slack.com
      port: 443
      access: full
    - host: wss-backup.slack.com
      port: 443
      access: full
    binaries:
    - path: /usr/bin/curl
    - path: /usr/local/bin/node
    - path: /usr/bin/node
    - path: /usr/bin/python3
    - path: /usr/bin/python3.11
    - path: /usr/local/bin/python3
    - path: /usr/local/bin/hermes
  tavily:
    name: tavily
    endpoints:
    - host: api.tavily.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: POST, path: /search }
    binaries:
    - path: /usr/bin/python3
    - path: /usr/bin/python3.11
    - path: /usr/local/bin/python3
    - path: /usr/bin/curl
    - path: /usr/local/bin/hermes
  github:
    name: github
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: GET, path: /** }
      - allow: { method: POST, path: /** }
    - host: github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: GET, path: /** }
      - allow: { method: POST, path: /** }
    binaries:
    - path: /usr/bin/gh
    - path: /usr/bin/git
    - path: /usr/bin/curl
    - path: /usr/bin/python3
    - path: /usr/bin/python3.11
    - path: /usr/local/bin/python3
    - path: /usr/local/bin/hermes
  phoenix_collector:
    name: phoenix_collector
    endpoints:
    - host: '172.17.0.1'
      port: 6006
      protocol: rest
      enforcement: enforce
      rules:
      - allow: { method: POST, path: /** }
    binaries:
    - path: /usr/bin/python3.11
