#
# Agent manifest for the Shrike governance recipe.
#
# Shrike governs at the ACTION boundary via an OpenClaw `before_tool_call`
# plugin (plugin/, installed by install.sh or baked in by build-image.sh), not
# by removing tools from the agent. The agent keeps its full toolset; every
# tool call is evaluated by Shrike before it runs and blocked when the verdict
# is block / require_approval. This keeps the recipe a drop-in governance layer
# over whatever workflow the operator runs.
main:
  tools: {}
