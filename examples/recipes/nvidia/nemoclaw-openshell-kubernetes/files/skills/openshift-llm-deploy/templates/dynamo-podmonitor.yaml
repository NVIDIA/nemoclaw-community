# Render every ${...} placeholder before applying. This is an agent template,
# not a ready-to-apply manifest.
#
# Makes OpenShift user-workload monitoring scrape Dynamo model pods so serving
# telemetry (queue depth, KV-cache usage, time-to-first-token, tokens/sec)
# becomes queryable alongside DCGM GPU telemetry. One PodMonitor covers every
# DynamoGraphDeployment in the namespace.
#
# Requires enableUserWorkload: true in the cluster-monitoring-config ConfigMap.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dynamo-model-metrics
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: dynamo
    app.kubernetes.io/managed-by: hermes
spec:
  selector:
    matchExpressions:
      # Covers every Dynamo graph deployment in the namespace rather than
      # pinning a single release.
      - key: nvidia.com/dynamo-graph-deployment-name
        operator: Exists
  podMetricsEndpoints:
    # Worker system port: dynamo_component_* and vllm:* engine metrics.
    - port: system
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
    # Frontend http port: dynamo_component_router_* request and latency metrics.
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
