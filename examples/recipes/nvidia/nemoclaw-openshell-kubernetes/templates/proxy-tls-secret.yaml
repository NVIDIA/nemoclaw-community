# SPDX-License-Identifier: Apache-2.0
{{- $name := include "nemoclaw-openshell.proxyTlsSecretName" . -}}
{{- $caKey := .Values.sre.proxy.tlsSecretRef.caKey -}}
{{- $certKey := .Values.sre.proxy.tlsSecretRef.certKey -}}
{{- $privateKeyKey := .Values.sre.proxy.tlsSecretRef.privateKeyKey -}}
{{- $caData := "" -}}
{{- $certData := "" -}}
{{- $privateKeyData := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
  {{- if not (and $existing.data (hasKey $existing.data $caKey) (hasKey $existing.data $certKey) (hasKey $existing.data $privateKeyKey)) -}}
    {{- fail (printf "existing proxy TLS Secret %s is missing one or more configured keys" $name) -}}
  {{- end -}}
  {{- $caData = index $existing.data $caKey -}}
  {{- $certData = index $existing.data $certKey -}}
  {{- $privateKeyData = index $existing.data $privateKeyKey -}}
{{- else -}}
  {{- $ca := genCA (printf "%s proxy CA" (include "nemoclaw-openshell.fullname" .)) 3650 -}}
  {{- $sre := include "nemoclaw-openshell.sreProxyName" . -}}
  {{- $metrics := include "nemoclaw-openshell.metricsProxyName" . -}}
  {{- $deletion := include "nemoclaw-openshell.modelDeleteProxyName" . -}}
  {{- $dnsNames := list
        $sre
        (printf "%s.%s" $sre .Release.Namespace)
        (printf "%s.%s.svc" $sre .Release.Namespace)
        (printf "%s.%s.svc.cluster.local" $sre .Release.Namespace)
        $metrics
        (printf "%s.%s" $metrics .Release.Namespace)
        (printf "%s.%s.svc" $metrics .Release.Namespace)
        (printf "%s.%s.svc.cluster.local" $metrics .Release.Namespace)
        $deletion
        (printf "%s.%s" $deletion .Release.Namespace)
        (printf "%s.%s.svc" $deletion .Release.Namespace)
        (printf "%s.%s.svc.cluster.local" $deletion .Release.Namespace)
  -}}
  {{- $certificate := genSignedCert $sre nil $dnsNames 825 $ca -}}
  {{- $caData = $ca.Cert | b64enc -}}
  {{- $certData = $certificate.Cert | b64enc -}}
  {{- $privateKeyData = $certificate.Key | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw-openshell.labels" . | nindent 4 }}
  annotations:
    nemoclaw.nvidia.com/purpose: authenticated-internal-api-proxy-tls
type: kubernetes.io/tls
data:
  {{ $caKey | quote }}: {{ $caData | quote }}
  {{ $certKey | quote }}: {{ $certData | quote }}
  {{ $privateKeyKey | quote }}: {{ $privateKeyData | quote }}
{{- end }}
