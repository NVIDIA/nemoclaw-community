apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nemoclaw-openshell.modelDeleteProxyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nemoclaw-openshell.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nemoclaw-openshell.modelDeleteProxyName" . }}
  namespace: {{ .Values.sre.openshiftLlmDeploy.deletion.namespace }}
  labels:
    {{- include "nemoclaw-openshell.labels" . | nindent 4 }}
rules:
  # Inventory uses the separate general no-delete proxy. This identity has
  # only exact destructive authorizations supplied by the operator.
  # API-group/resource/name tuple. Namespace scope alone is not ownership.
  {{- range .Values.sre.openshiftLlmDeploy.deletion.allowedResources }}
  - apiGroups: [{{ .apiGroup | quote }}]
    resources: [{{ .resource | quote }}]
    resourceNames: [{{ .name | quote }}]
    verbs: ["delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nemoclaw-openshell.modelDeleteProxyName" . }}
  namespace: {{ .Values.sre.openshiftLlmDeploy.deletion.namespace }}
  labels:
    {{- include "nemoclaw-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "nemoclaw-openshell.modelDeleteProxyName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nemoclaw-openshell.modelDeleteProxyName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
