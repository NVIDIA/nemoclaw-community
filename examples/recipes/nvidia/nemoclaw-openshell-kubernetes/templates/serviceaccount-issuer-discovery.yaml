{{- if .Values.platform.serviceAccountIssuerDiscovery.createPublicBinding }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nemoclaw-openshell.clusterResourceName" . }}-public-oidc-discovery
  labels:
    {{- include "nemoclaw-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Kubernetes supplies this narrowly scoped role. It permits GET only on
  # /.well-known/openid-configuration and /openid/v1/jwks.
  name: system:service-account-issuer-discovery
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:unauthenticated
{{- end }}
