preset:
  name: huggingface-readonly
  description: "Read-only NVIDIA pages on Hugging Face"

network_policies:
  huggingface_readonly:
    name: huggingface_readonly
    endpoints:
      - host: huggingface.co
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
    binaries:
      - { path: /usr/local/bin/node* }
      - { path: /usr/bin/node* }
      - { path: /usr/local/python* }
      - { path: /usr/bin/python* }
      - { path: /usr/local/curl* }
      - { path: /usr/bin/curl* }
