preset:
  name: arxiv
  description: "arXiv access"

network_policies:
  arxiv_access:
    name: arxiv_access
    endpoints:
      # Main arXiv website and document download entry point
      - host: arxiv.org
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      # arXiv API and metadata export endpoint
      - host: export.arxiv.org
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
    binaries:
      - { path: /usr/local/bin/node* }
      - { path: /usr/bin/node* }
      - { path: /usr/local/python* }
      - { path: /usr/bin/python* }
      - { path: /usr/local/curl* }
      - { path: /usr/bin/curl* }
