preset:
  name: nvidia-ext
  description: "NVIDIA website access"

network_policies:
  nvidia-ext:
    name: nvidia-ext
    endpoints:
      - host: www.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      - host: docs.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      - host: developer.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      - host: blogs.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      - host: build.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      - host: forums.developer.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
      - host: catalog.ngc.nvidia.com
        port: 443
        access: read-only
        protocol: rest
        enforcement: enforce
    binaries:
      - { path: /usr/local/bin/node* }
      - { path: /usr/bin/node* }
      - { path: /usr/local/python* }
      - { path: /usr/bin/python* }
      - { path: /usr/local/curl* }
      - { path: /usr/bin/curl* }
