# Dedicated Ask NemoClaw ingress for a Brev HTTP Secure Link. Keeping this on
# a separate listener prevents the Brev control UI and Hermes dashboard from
# competing for absolute /api and WebSocket paths.
server {
    listen 0.0.0.0:__PROXY_PORT__;
    server_name __PUBLIC_HOST__;
    # Match the plugin's maximum encoded JSON request size, in bytes.
    client_max_body_size 6000000;

    location / {
        proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Use the configured public host, but preserve the caller's Origin so
        # Hermes and the plugin can reject requests from unrelated websites.
        proxy_set_header Host __PUBLIC_HOST__;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host __PUBLIC_HOST__;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }
}
