# Dedicated Ask NemoClaw ingress for a Brev HTTP Secure Link. Keeping this on
# a separate listener prevents the Brev control UI and Hermes dashboard from
# competing for absolute /api and WebSocket paths.
server {
    listen 0.0.0.0:__PROXY_PORT__;
    server_name __PUBLIC_HOST__;

    location / {
        proxy_pass http://127.0.0.1:__DASHBOARD_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve the one configured public identity. Hermes validates this
        # Host and Origin against dashboard.public_url and enables its bundled
        # authentication provider instead of treating the request as loopback.
        proxy_set_header Host __PUBLIC_HOST__;
        proxy_set_header Origin __PUBLIC_URL__;
        proxy_set_header X-Forwarded-Host __PUBLIC_HOST__;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }
}
