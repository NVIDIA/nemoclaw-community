# Annotated NemoClaw network grant template.
# Have the user add a copy, with the hosts edited, on their HOST machine under
# spec.sandboxes.<sandbox>.network.grants in the deployment YAML, then apply it
# from the host:
#   nemoclaw plan nemoclaw.yaml
#   nemoclaw apply nemoclaw.yaml

# Grant name: unique within the sandbox's grants, kebab-case, named after the site.
example-site:
  endpoints:
    # One entry per hostname the sandbox should be allowed to reach.
    # Subdomains are NOT implied: list www.example.com, api.example.com, ... separately.
    - host: example.com
      port: 443                 # almost always 443 (HTTPS)
      access: read-only         # allow only GET/HEAD
      protocol: rest
      enforcement: enforce
    - host: api.example.com
      port: 443
      access: read-only
      protocol: rest
      enforcement: enforce
  # binaries is omitted on purpose: NemoClaw limits the grant to the agent's
  # own executables.
