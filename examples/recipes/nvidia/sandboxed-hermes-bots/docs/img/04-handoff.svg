<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1f1a" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76b900"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#0b0d0b"/>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <text x="48" y="56" fill="#e5e7eb" font-size="26" font-weight="700">A handoff</text>

  <!-- desktop -->
  <rect x="48" y="130" width="160" height="150" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="128" y="200" fill="#e5e7eb" font-size="15" font-weight="700" text-anchor="middle">Desktop</text>
  <text x="128" y="224" fill="#9ca3af" font-size="12" text-anchor="middle">you type once</text>

  <line x1="208" y1="205" x2="270" y2="205" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- researcher -->
  <rect x="274" y="130" width="400" height="150" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  <text x="294" y="162" fill="#76b900" font-size="14" font-weight="700" letter-spacing="1.5">NEMOCLAW-RESEARCHER</text>
  <text x="294" y="196" fill="#d1d5db" font-size="14">does the work</text>
  <rect x="294" y="218" width="360" height="40" rx="6" fill="#0b0d0b" stroke="#2d3a2d"/>
  <text x="310" y="244" fill="#76b900" font-size="13">message_teammate(reviewer, findings)</text>

  <line x1="674" y1="205" x2="746" y2="205" stroke="#76b900" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="712" y="298" fill="#9ca3af" font-size="12" text-anchor="middle">one HTTP call</text>

  <!-- reviewer -->
  <rect x="750" y="130" width="402" height="150" rx="12" fill="rgba(118,185,0,0.06)" stroke="#76b900" stroke-width="2"/>
  <text x="770" y="162" fill="#76b900" font-size="14" font-weight="700" letter-spacing="1.5">NEMOCLAW-REVIEWER</text>
  <text x="770" y="196" fill="#d1d5db" font-size="14">own role, own memory, own policy</text>
  <text x="770" y="244" fill="#d1d5db" font-size="14">replies</text>

  <!-- what crosses -->
  <rect x="274" y="310" width="878" height="70" rx="10" fill="#111611" stroke="#374151" stroke-width="1.5"/>
  <text x="294" y="340" fill="#76b900" font-size="14">✓  text and the reviewer's own key</text>
  <text x="294" y="366" fill="#f87171" font-size="14">✕  files, memory, shell, the researcher's keys</text>

  <text x="48" y="420" fill="#9ca3af" font-size="14">Text crosses the wall. Nothing else does.</text>
</svg>
