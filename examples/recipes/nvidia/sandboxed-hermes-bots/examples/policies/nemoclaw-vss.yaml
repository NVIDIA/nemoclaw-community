#
# Additive preset: let one bot reach NVIDIA RT-VLM (the vision model from the
# VSS blueprint) on the OpenShell bridge. No other bot gets this; that is the
# point. This is a template: __VSS_PORT__ is filled from the port in
# VSS_BASE_URL (swarm.env) when `swarm` applies it, so the policy always
# matches the endpoint the bot is configured to call.
#
# To apply by hand, replace __VSS_PORT__ first:
#   sed 's/__VSS_PORT__/8018/' examples/policies/nemoclaw-vss.yaml > /tmp/vss.yaml
#   nemoclaw <sandbox> policy-add --from-file /tmp/vss.yaml --yes
preset:
  name: vss-rtvlm
  description: Reach RT-VLM on the bridge
network_policies:
  vss-rtvlm:
    name: vss-rtvlm
    endpoints:
      - { host: host.openshell.internal, port: __VSS_PORT__, tls: skip }
    binaries:
      - { path: /sandbox/.hermes/hermes-agent/venv/bin/python }
      - { path: /sandbox/.hermes/hermes-agent/venv/bin/* }
      - { path: /usr/bin/curl }
      - { path: /bin/sh }
