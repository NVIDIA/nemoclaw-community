#
# prometheus-adapter: expose the DCGM GPU utilization custom metric used by this
# recipe's Kubernetes HPA. Latency / request_rate HPA adapter rules are deferred
# to a follow-up PR.

prometheus:
  url: http://REPLACE_PROMETHEUS_SERVICE.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    # DCGM exporter attributes GPU util to workloads via exported_* labels (not pod/namespace).
    - seriesQuery: 'DCGM_FI_DEV_GPU_UTIL{exported_namespace!="",exported_pod!=""}'
      resources:
        overrides:
          exported_namespace:
            resource: namespace
          exported_pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "gpu_utilization_percent"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
