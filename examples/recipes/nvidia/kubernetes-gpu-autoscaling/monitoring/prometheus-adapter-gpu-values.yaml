#
# prometheus-adapter: expose HPA custom metrics.
# Default recipe signal: DCGM GPU utilization.
# Optional LLM signals from the agent ServiceMonitor (/metrics): latency gauges and
# successful request rate. Select one via autoscaling.metric / HPA_METRIC.

prometheus:
  url: http://REPLACE_PROMETHEUS_SERVICE.monitoring.svc
  port: 9090

rules:
  default: false
  custom:
    # DCGM exporter attributes GPU util to workloads via exported_* labels (not pod/namespace).
    - seriesQuery: 'DCGM_FI_DEV_GPU_UTIL{exported_namespace!="",exported_pod!=""}'
      resources:
        overrides:
          exported_namespace:
            resource: namespace
          exported_pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "gpu_utilization_percent"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    # Agent /metrics gauges (namespace/pod from Kubernetes service discovery).
    - seriesQuery: 'nemoclaw_llm_latency_p50_milliseconds{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_llm_latency_p50_milliseconds"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    - seriesQuery: 'nemoclaw_llm_latency_p95_milliseconds{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_llm_latency_p95_milliseconds"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    - seriesQuery: 'nemoclaw_llm_latency_avg_milliseconds{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_llm_latency_avg_milliseconds"
      metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'

    - seriesQuery: 'nemoclaw_llm_requests_total{result="success",namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^(.*)$"
        as: "nemoclaw_llm_request_rate"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[1m])) by (<<.GroupBy>>)'
