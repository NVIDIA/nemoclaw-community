# The credential key is `SLACK_USER_TOKEN`, and the name matters.
#
# Hermes removes a set of credential names from the environment of the
# subprocesses it spawns — cron pre-steps included — so that a shell command an
# agent wrote cannot read them. The set is name-based and includes the names
# Hermes's own Slack integration uses. A provider whose key collided with one
# of those would attach cleanly and deliver nothing this collector can see:
# a silent failure, which is the worst kind this recipe can have.
#
# Check it on your own install rather than taking this on trust:
#
#   python3 -c "from tools.environments import local as l; \
#     print(sorted(l._ALWAYS_STRIP_KEYS | l._HERMES_PROVIDER_ENV_BLOCKLIST))"
#
# run from the Hermes install directory with its interpreter. On Hermes 0.20.0
# that set contains SLACK_BOT_TOKEN, SLACK_APP_TOKEN and SLACK_SIGNING_SECRET,
# and does not contain SLACK_USER_TOKEN. It is a list in a file, so a future
# Hermes could add this name; `ingest_slack.py` fails loudly rather than
# quietly when the variable is missing, which is the part that does not depend
# on the list staying as it is.
id: memory-driven-cos-slack-user
display_name: Memory-Driven CoS — Slack user read
description: >-
  Read-only Slack access as the user, for the scheduled intake collector.
  Static user token; this recipe does not refresh rotating ones.
category: generic
credentials:
  - name: slack_user_token
    description: Slack User OAuth Token (xoxp-), static
    env_vars: [SLACK_USER_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: slack.com
    port: 443
    protocol: rest
