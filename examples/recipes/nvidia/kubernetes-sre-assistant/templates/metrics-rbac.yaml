apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sre-assistant.metricsProxyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- if .Values.deployer.platform.openshift.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sre-assistant.clusterResourceName" . }}-metrics
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: {{ include "sre-assistant.metricsProxyName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
