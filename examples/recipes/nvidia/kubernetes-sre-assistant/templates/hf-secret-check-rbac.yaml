# Only the trusted proxy gets this grant. The sandbox receives synthetic
# existence metadata; Kubernetes RBAC itself does not redact Secret contents.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sre-assistant.proxyName" . }}-hf-check
  namespace: {{ include "sre-assistant.modelDeployNamespace" . }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.global.sre.openshiftLlmDeploy.hfTokenSecretRef.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sre-assistant.proxyName" . }}-hf-check
  namespace: {{ include "sre-assistant.modelDeployNamespace" . }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sre-assistant.proxyName" . }}-hf-check
subjects:
  - kind: ServiceAccount
    name: {{ include "sre-assistant.proxyName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
