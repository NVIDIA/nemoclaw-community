apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-assistant.proxyName" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sre-proxy
      {{- include "sre-assistant.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            # Agent Sandbox controllers label realized Pods with this hash.
            # OpenShell metadata labels remain on the Sandbox CR and are not
            # guaranteed to propagate to the Pod. The proxy bearer token is
            # still the authorization boundary after this network admission.
            matchExpressions:
              - key: agents.x-k8s.io/sandbox-name-hash
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.global.sre.proxy.port }}
{{- if .Values.global.sre.openshiftLlmDeploy.deletion.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-assistant.modelDeleteProxyName" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: model-delete-proxy
      {{- include "sre-assistant.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: agents.x-k8s.io/sandbox-name-hash
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.global.sre.proxy.port }}
{{- end }}
{{- if .Values.global.sre.openshiftLlmDeploy.metrics.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-assistant.metricsProxyName" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: metrics-proxy
      {{- include "sre-assistant.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: agents.x-k8s.io/sandbox-name-hash
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.global.sre.proxy.port }}
{{- end }}
{{- end }}
