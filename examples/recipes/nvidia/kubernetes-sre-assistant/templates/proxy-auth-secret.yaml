{{- if not .Values.global.sre.proxy.authSecretRef.name }}
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0
{{- $name := include "sre-assistant.proxyAuthSecretName" . -}}
{{- $key := .Values.global.sre.proxy.authSecretRef.key -}}
{{- $token := randAlphaNum 64 | b64enc -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (hasKey $existing.data $key) -}}
  {{- $token = index $existing.data $key -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-assistant.labels" . | nindent 4 }}
  annotations:
    nemoclaw.nvidia.com/purpose: sandbox-to-api-proxy-authentication
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}
