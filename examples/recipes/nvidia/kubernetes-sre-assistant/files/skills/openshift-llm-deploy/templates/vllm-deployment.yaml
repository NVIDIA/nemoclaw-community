# Render every ${...} placeholder before applying. This is an agent template,
# not a ready-to-apply manifest.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${RELEASE}-model-cache
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: ${RELEASE}
    app.kubernetes.io/managed-by: hermes
    app.kubernetes.io/component: inference
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ${STORAGE_CLASS}
  resources:
    requests:
      storage: ${PVC_SIZE}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RELEASE}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: ${RELEASE}
    app.kubernetes.io/managed-by: hermes
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: ${RELEASE}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: ${RELEASE}
        app.kubernetes.io/managed-by: hermes
        app.kubernetes.io/component: inference
    spec:
      serviceAccountName: ${MODEL_RUNNER_SERVICE_ACCOUNT}
      automountServiceAccountToken: false
      ${NODE_SELECTOR_BLOCK}
      containers:
        - name: vllm
          image: ${VLLM_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /models/model
            - --served-model-name
            - ${SERVED_MODEL_NAME}
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            ${VLLM_ARGS}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /models
          resources:
            requests:
              nvidia.com/gpu: ${GPU_COUNT}
              memory: ${MEMORY_REQUEST}
            limits:
              nvidia.com/gpu: ${GPU_COUNT}
              memory: ${MEMORY_LIMIT}
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ${RELEASE}-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ${RELEASE}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: ${RELEASE}
    app.kubernetes.io/managed-by: hermes
    app.kubernetes.io/component: inference
spec:
  type: ${SERVICE_TYPE}
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: ${RELEASE}
  ports:
    - name: http
      port: 8000
      targetPort: http
