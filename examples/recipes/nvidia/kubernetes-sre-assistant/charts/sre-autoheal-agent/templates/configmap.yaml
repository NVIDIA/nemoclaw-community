apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-autoheal.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-autoheal.labels" . | nindent 4 }}
data:
  config.json: |-
    {{- include "sre-autoheal.agentConfig" . | nindent 4 }}
{{- if .Values.agentSource.fromConfigMap }}
---
# Agent source code (pure standard-library Python) so no image build is needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-autoheal.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-autoheal.labels" . | nindent 4 }}
  annotations:
    sre-autoheal.nvidia.com/source-sha256: {{ (.Files.Glob "files/agent/sre_autoheal/*.py").AsConfig | sha256sum | quote }}
data:
{{ (.Files.Glob "files/agent/sre_autoheal/*.py").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sre-autoheal.fullname" . }}-knowledge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-autoheal.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/agent/knowledge/failure_patterns.json").AsConfig | indent 2 }}
{{- end }}
