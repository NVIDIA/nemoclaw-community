{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-autoheal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-autoheal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-autoheal.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # DNS
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Kubernetes API (443 and 6443 cover most distributions)
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
