{{- if eq .Values.runMode "cronjob" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sre-autoheal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sre-autoheal.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "sre-autoheal.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- include "sre-autoheal.podSpec" (dict "root" . "args" (list "heal" "--once")) | nindent 10 }}
{{- end }}
