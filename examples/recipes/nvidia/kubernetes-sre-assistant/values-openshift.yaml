# OpenShift profile. This is the kubernetes-deployer chart's values-openshift.yaml
# nested under the `deployer` key; keep the two files in step (the recipe tests
# compare them). The acknowledgements are required because the OpenShell
# combined supervisor currently needs the privileged SCC and the gateway needs
# anonymous access to the ServiceAccount issuer's JWKS endpoint.
deployer:
  platform:
    serviceAccountIssuerDiscovery:
      createPublicBinding: true
      dangerousAcknowledgement: I_ACKNOWLEDGE_PUBLIC_OIDC_DISCOVERY
    openshift:
      enabled: true
      createPrivilegedSccBinding: true
      dangerousAcknowledgement: I_ACKNOWLEDGE_PRIVILEGED_SCC
  openshell:
    podSecurityContext:
      fsGroup: null
    securityContext:
      runAsUser: null
    server:
      oidc:
        issuer: https://kubernetes.default.svc
      openshift:
        gatewayUid:
          enabled: true
          offset: 1
          value: null
        sandboxUid:
          enabled: true
          offset: 2
          value: null
      enableUserNamespaces: false

# Values for the vendored sre-autoheal-agent subchart, mirroring its own
# values-openshift.yaml. OpenShift assigns UIDs from the namespace SCC range, so none are pinned.
# The recipe tests compare these two files line for line.
autoheal:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
  agentConfig:
    scope:
      exclude_namespaces:
        - kube-system
        - kube-public
        - kube-node-lease
        - openshift
        - "openshift-*"
        - agent-sandbox-system
        - default
