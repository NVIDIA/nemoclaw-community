# NV Tech Assistant on NemoClaw v0.1.0-rc.4: one OpenClaw agent on a managed
# local Docker gateway, NVIDIA Endpoints inference, read-only grants to the
# sources the skill researches, and the skill on a read-only Docker volume.

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: nv-tech-assistant
  uid: 3c49bcbc-6b47-4145-80d1-a8dcfb3ff6ab
spec:
  gateway:
    management: managed
    target:
      docker:
        port: 17671
        # Docker Desktop on macOS: unix:///Users/YOU/.docker/run/docker.sock
        engine: unix:///var/run/docker.sock
        networkCIDR: 172.20.0.0/24
    config:
      openshell.drivers.docker:
        # Lets the sandbox mount the skill volume.
        allow_driver_config: true
  inferenceProviders:
    nvidia:
      provider: openai
      api: openai-completions
      endpoint: https://integrate.api.nvidia.com/v1
      credential:
        env: NVIDIA_INFERENCE_API_KEY
  sandboxes:
    nv-tech-assistant:
      image:
        # The OpenClaw agent image that NemoClaw v0.1.0-rc.4 lists.
        ref: ghcr.io/nvidia/nemoclaw/v1/openclaw@sha256:bd4d5483797673c83d1dc607893c6e61b84b92cc467a181c2c278614344c168d
      driverConfig:
        docker:
          mounts:
            - type: volume
              source: nv-tech-assistant-skills
              target: /sandbox/skills
              read_only: true
      network:
        tier: isolated
        # Read-only (GET and HEAD) access for the agent's own executables.
        # Subdomains are not implied: list each hostname.
        grants:
          nvidia:
            endpoints:
              - {host: www.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: docs.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: developer.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: blogs.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: build.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: forums.developer.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: catalog.ngc.nvidia.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
          github:
            endpoints:
              - {host: github.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: api.github.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: raw.githubusercontent.com, port: 443, access: read-only, protocol: rest, enforcement: enforce}
          huggingface:
            endpoints:
              - {host: huggingface.co, port: 443, access: read-only, protocol: rest, enforcement: enforce}
          arxiv:
            endpoints:
              - {host: arxiv.org, port: 443, access: read-only, protocol: rest, enforcement: enforce}
              - {host: export.arxiv.org, port: 443, access: read-only, protocol: rest, enforcement: enforce}
      harness:
        kind: nvidia.fabric.openclaw
        runtime:
          timeout_seconds: 300
      agent:
        name: main
        skills:
          directories:
            - folder: /sandbox/skills
          duplicates: reject
        inference:
          routes:
            - name: primary
              providerRef: nvidia
              overrides:
                model: nvidia/nemotron-3.5-super-vl-120b-a12b
                maxTokens: 16384
