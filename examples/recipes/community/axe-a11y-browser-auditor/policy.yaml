version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /etc
  read_write:
  - /workspace
  - /tmp
network_policies:
  axe_a11y_service:
    name: axe_a11y_service
    endpoints:
    - host: host.openshell.internal
      port: 9010
      protocol: http
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /healthz
      - allow:
          method: POST
          path: /mcp
      - allow:
          method: GET
          path: /mcp
      - allow:
          method: DELETE
          path: /mcp
      - allow:
          method: GET
          path: /artifacts/**
    binaries:
    - path: /usr/local/bin/openclaw
    - path: /usr/local/bin/node
    - path: /usr/bin/node
    - path: /usr/bin/curl
    - path: /usr/bin/python3
