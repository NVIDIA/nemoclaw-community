#
# Full sandbox policy for the local-only workspace assistant.
# Principle: deny by default. This file declares no network endpoint. The only
# egress the sandbox has comes from the provider that setup attaches, whose
# profile (ollama-provider-profile.yaml) names the recipe-owned Ollama server.
#
# scripts/verify.sh checks this file. Keep the plain block style: the check
# reads the file without a YAML library and rejects anchors, aliases, merge
# keys, and block scalars.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies: {}

# Deliberately absent: every network endpoint, including every remote
# inference API.
# /mnt, /srv, /home, /root, and /var are also absent from filesystem_policy.
