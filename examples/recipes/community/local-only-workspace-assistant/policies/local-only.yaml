#
# Full sandbox policy for the local-only workspace assistant.
# Principle: deny by default. The only egress endpoint is inference.local,
# the OpenShell route to the inference provider that the operator selects.
#
# scripts/verify.sh checks this file. Keep the plain block style: the check
# reads the file without a YAML library and rejects anchors, aliases, merge
# keys, and block scalars.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: POST
              path: /v1/responses
          - allow:
              method: POST
              path: /v1/completions
          - allow:
              method: POST
              path: /v1/embeddings
          - allow:
              method: GET
              path: /v1/models
          - allow:
              method: GET
              path: /v1/models/**
    binaries:
      - path: /usr/local/bin/openclaw
      - path: /usr/local/bin/node
      - path: /usr/bin/node
      - path: /usr/bin/python3*

# Deliberately absent: every remote inference API and every other host.
# /mnt, /srv, /home, /root, and /var are also absent from filesystem_policy.
