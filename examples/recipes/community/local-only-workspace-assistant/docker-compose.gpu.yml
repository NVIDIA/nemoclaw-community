# Adds the NVIDIA GPU reservation to the Ollama server in docker-compose.yml.
# Docker rejects this reservation on a host without the NVIDIA Container
# Toolkit, so scripts/bring-up.sh adds this file only when it finds a GPU.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
