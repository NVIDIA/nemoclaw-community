# Loaded in-process by Hermes's bundled observability/nemo_relay plugin.
version = 1

[[components]]
kind = "observability"
enabled = true

[components.config]
version = 1

[components.config.openinference]
enabled = true
transport = "http_binary"
endpoint = "http://host.openshell.internal:6006/v1/traces"
service_name = "financial-assistant-agent"
timeout_millis = 3000

[components.config.openinference.resource_attributes]
"openinference.project.name" = "financial-assistant-agent"
"deployment.environment" = "demo"

[[components]]
kind = "adaptive"
enabled = true

[components.config.tool_parallelism]
mode = "observe_only"
