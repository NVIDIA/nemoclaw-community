# SPDX-License-Identifier: Apache-2.0
version = 1

[[components]]
kind = "observability"
enabled = true

[components.config]
version = 1

[components.config.atof]
enabled = true
path = "/tmp/finance-assistant-atof.jsonl"

[components.config.atif]
enabled = true
output_dir = "/tmp/finance-assistant-atif"

[components.config.openinference]
enabled = true
transport = "http_binary"
endpoint = "http://host.openshell.internal:6006/v1/traces"
service_name = "financial-assistant-agent"
service_namespace = "nemo"
service_version = "1.0.0"
instrumentation_scope = "nemo-relay-openinference"
timeout_millis = 3000

[components.config.openinference.resource_attributes]
"deployment.environment" = "brev-demo"
"demo.channel" = "web-outlook"
