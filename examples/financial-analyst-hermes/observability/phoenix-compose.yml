services:
  phoenix:
    container_name: financial-phoenix
    image: arizephoenix/phoenix:17.13.0
    restart: unless-stopped
    ports:
      - "6006:6006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
