# SPDX-License-Identifier: Apache-2.0

id: compatible-chat-api
display_name: OpenAI-Compatible Chat API
description: Provider template for any OpenAI-compatible chat completions API
category: inference
credentials:
  - name: api_key
    description: Chat completions API key
    env_vars: [FINANCE_API_KEY, OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
endpoints:
  - host: api.provider.example
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
inference_capable: true
