#
# The sandbox policy with the guard. The LLM endpoint comes from the provider
# attached with --provider.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/opt, /usr, /lib, /proc, /dev/urandom, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
network_policies:
  workspace:
    endpoints:
      - host: host.openshell.internal
        port: 18580
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: POST, path: /mcp}
          - allow: {method: GET, path: /mcp}
          - allow: {method: DELETE, path: /mcp}
    binaries:
      - path: /usr/bin/python3.13
network_middlewares:
  decision-guard:
    middleware: decision-model-guard
    order: 10
    config: {}
    on_error: fail_closed
    endpoints:
      # The LLM endpoint, to read the conversation, and the workspace, to judge tool calls.
      include: [integrate.api.nvidia.com, host.openshell.internal]
