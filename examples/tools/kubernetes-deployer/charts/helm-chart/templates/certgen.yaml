{{- if or .Values.pkiInitJob.enabled .Values.certManager.enabled }}
{{- $hookName := printf "%s-certgen" (include "openshell.fullname" .) }}
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    # hook-succeeded removes this prerequisite once every pre-install or
    # pre-upgrade hook has completed, so `helm uninstall` leaves no hook
    # identity or RBAC behind. Helm 3 keeps it after a failed certgen Job until
    # the next attempt replaces it; Helm 4 also removes it on that failure.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $hookName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    # hook-succeeded removes this prerequisite once every pre-install or
    # pre-upgrade hook has completed, so `helm uninstall` leaves no hook
    # identity or RBAC behind. Helm 3 keeps it after a failed certgen Job until
    # the next attempt replaces it; Helm 4 also removes it on that failure.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $hookName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    # hook-succeeded removes this prerequisite once every pre-install or
    # pre-upgrade hook has completed, so `helm uninstall` leaves no hook
    # identity or RBAC behind. Helm 3 keeps it after a failed certgen Job until
    # the next attempt replaces it; Helm 4 also removes it on that failure.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $hookName }}
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName }}
  namespace: {{ $ns }}
  labels:
    {{- include "openshell.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "openshell.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $hookName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: certgen
          image: {{ include "openshell.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/usr/local/bin/openshell-gateway"]
          args:
            - generate-certs
            {{- if .Values.certManager.enabled }}
            - --jwt-only
            {{- else }}
            - --server-secret-name={{ .Values.server.tls.certSecretName }}
            - --client-secret-name={{ .Values.server.tls.clientTlsSecretName }}
            {{- end }}
            - --jwt-secret-name={{ include "openshell.sandboxJwtSecretName" . }}
            {{- if and .Values.pkiInitJob.enabled (not .Values.certManager.enabled) }}
            {{- range (include "openshell.defaultServerDnsNames" . | fromYamlArray) }}
            - --server-san={{ . }}
            {{- end }}
            - --server-san=127.0.0.1
            {{- range .Values.pkiInitJob.serverDnsNames }}
            - --server-san={{ . }}
            {{- end }}
            {{- range .Values.pkiInitJob.serverIpAddresses }}
            - --server-san={{ . }}
            {{- end }}
            {{- end }}
{{- end }}
