# Kubernetes is the default platform. OpenShift behavior is opt-in and is never
# inferred from API discovery so that the rendered release remains deterministic.
platform:
  # The OpenShell gateway resolves its OIDC issuer by fetching
  # <issuer>/.well-known/openid-configuration and the advertised JWKS with an
  # anonymous HTTP client (OpenShell 0.0.116 has no credentialed discovery).
  # With the default in-cluster ServiceAccount issuer, standard Kubernetes
  # serves neither endpoint anonymously and stock OpenShift serves only the
  # discovery document, so a managed gateway must choose exactly one option:
  #   createPublicBinding: true  binds the built-in ClusterRole
  #     system:service-account-issuer-discovery (issuer metadata and public
  #     signing keys only) to system:unauthenticated and requires the
  #     acknowledgement below. values-kubernetes.yaml and values-openshift.yaml
  #     set this.
  #   preexistingAnonymousAccess: true  states that the cluster already
  #     exposes both endpoints anonymously. The bootstrap Job verifies that
  #     with an unauthenticated request before it creates the sandbox.
  # Rendering fails when neither is chosen for the in-cluster issuer.
  serviceAccountIssuerDiscovery:
    createPublicBinding: false
    dangerousAcknowledgement: ""
    preexistingAnonymousAccess: false
  openshift:
    enabled: false
    # Fail install/template when the OpenShift security API is unavailable.
    # Set false only for offline `helm lint`, which cannot inject API versions.
    verifyApi: true
    # Creates only the privileged SCC RoleBinding required by the OpenShell
    # sandbox supervisor. It never grants cluster-admin.
    createPrivilegedSccBinding: false
    dangerousAcknowledgement: ""

imagePullSecrets: []

agent:
  image:
    # Official multi-architecture NemoClaw-managed Hermes v0.0.117 image.
    multiarch: ghcr.io/nvidia/nemoclaw/hermes-sandbox@sha256:bcc2704ae28755fa0b9a1b5314f9438e614ca7a87e26ee401f32e3b6ecdf427d
    pullPolicy: IfNotPresent
  model:
    # Empty derives a release-scoped name. Existing-gateway mode also includes
    # a namespace/release hash so shared gateways do not cross-mutate providers.
    # Any explicit override must be globally unique within that gateway.
    providerName: ""
    providerType: openai
    name: nvidia/nemotron-3-super-120b-a12b
    baseUrl: https://integrate.api.nvidia.com/v1
    # Plain HTTP sends the model credential without transport encryption and
    # is rejected unless both fields below explicitly acknowledge that risk.
    allowInsecureHttp: false
    insecureHttpAcknowledgement: ""
    api: openai-completions
    contextWindow: 131072
    requestTimeoutSeconds: 300
    verifyEndpoint: true
    apiKeySecretRef:
      name: model-api-key
      key: api-key
  # Non-secret environment variables passed to Hermes. Secret-like names are
  # rejected; use model.apiKeySecretRef for the model credential. Values are
  # rendered as Helm templates, so an umbrella chart may reference
  # {{ .Release.Namespace }} or this chart's own values.
  env: {}
  # Template text that renders to the same NAME: value map and is merged over
  # env. An umbrella chart uses this form for entries that depend on its own
  # values, since Helm cannot replace the structured default with a string.
  envTemplate: ""
  # Additional subpaths of the retained Hermes state PVC presented inside the
  # sandbox, typically content a seed plugin wrote (skills, kubeconfigs,
  # staged binaries). Each entry needs mountPath (absolute, outside the
  # chart-managed /sandbox/workspace and /sandbox/.nemoclaw mounts), subPath
  # (relative to the PVC root, outside workspace/), and readOnly.
  #   - mountPath: /sandbox/.hermes/skills/example
  #     subPath: hermes/skills/example
  #     readOnly: true
  extraStateMounts: []
  # NemoClaw's Hermes gateway refuses OpenAI-compatible API turns with
  # `gateway_draining` unless /sandbox/.nemoclaw is a root-owned directory,
  # but OpenShell's Kubernetes driver chowns all of /sandbox to the injected
  # sandbox UID. The chart therefore mounts a small root-owned, read-only
  # volume there. A one-shot prepare Job (post-install/upgrade hook, root,
  # sandbox ServiceAccount) formats it, fixes ownership, and gives it an
  # SELinux label without MCS categories so any sandbox Pod can read it.
  # Nothing inside the sandbox writes to that directory. Disabling this keeps
  # the dashboard and terminal working but leaves the API draining.
  nemoclawHome:
    enabled: true
    # Empty inherits persistence.storageClass, then the cluster default.
    storageClass: ""
    size: 100Mi
  sandbox:
    # Empty derives a name within OpenShell's 19-character limit. On a shared
    # existing gateway the default is namespace-scoped. Explicit overrides must
    # be globally unique within that gateway.
    name: ""
    cpu: "2"
    memory: 8Gi
    runtimeClassName: ""
    nodeSelector: {}
    tolerations: []
    priorityClassName: ""
    resources:
      requests: {}
      limits: {}

# Extensions to the NemoClaw sandbox policy in files/policy.yaml. Both keys are
# merged structurally into the rendered policy, and string values are rendered
# as Helm templates so an umbrella chart can name namespace-local services.
policy:
  # Extra filesystem_policy.read_only paths inside the sandbox.
  readOnlyPaths: []
  # Extra network_policies entries keyed by OpenShell policy name. Each value
  # is a complete OpenShell network policy object (endpoints, binaries).
  networkPolicies: {}
  # Template text that renders to the same map and is merged with the entries
  # above (duplicate names are rejected). For umbrella charts, see envTemplate.
  networkPoliciesTemplate: ""

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  retainOnDelete: true

# The upstream OpenShell StatefulSet does not currently expose a StorageClass
# value for its SQLite volumeClaimTemplate. The umbrella chart pre-creates the
# claims by their deterministic StatefulSet names so clusters without a default
# StorageClass can still deploy. An empty storageClass inherits
# persistence.storageClass, then falls back to the cluster default.
gatewayPersistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  retainOnDelete: true

artifacts:
  # Buildless helper used to stage the architecture-specific OpenShell CLI and
  # run authenticated API proxies. This helper is an immutable multi-arch digest.
  utilityImage: docker.io/library/python:3.13.7-slim@sha256:5f55cdf0c5d9dc1a415637a5ccc4a9e18663ad203673173b8cda8f8dcacef689
  openshellCli:
    version: 0.0.116
    amd64:
      url: https://github.com/NVIDIA/OpenShell/releases/download/v0.0.116/openshell-x86_64-unknown-linux-musl.tar.gz
      sha256: 4fb4476d80a1875a0b83547ec3aba999cf0a2e2d75f95f2f709b622e2103520e
    arm64:
      url: https://github.com/NVIDIA/OpenShell/releases/download/v0.0.116/openshell-aarch64-unknown-linux-musl.tar.gz
      sha256: 7a949c48d1e000cd280869eea1e203e24816b9cfefc575b68a8b72b939cb3f43

lifecycle:
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  seed:
    enabled: true
    # Normal upgrades must not remount the live sandbox RWO PVC. To reseed
    # chart-managed skills, stop/delete the sandbox first and explicitly opt in.
    runOnUpgrade: false
    dangerousAcknowledgement: ""
    backoffLimit: 2
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 600
    # Seed plugins let a consuming chart populate chart-owned state (skills,
    # kubeconfigs, staged binaries) after the core seed has claimed the volume.
    # Each plugin ships a ConfigMap that is mounted at /plugins/<name>; its
    # entrypoint runs with SEED_STATE=/state and may import the core seed
    # module for ownership-aware file helpers. identity joins the sandbox
    # configuration identity so changed seed content forces a new sandbox.
    #   - name: example
    #     configMapName: "{{ .Release.Name }}-example-seed"
    #     entrypoint: seed_example.py
    #     identity: <content digest>
    #     env: [{name: EXAMPLE_ENDPOINT, value: "https://svc.{{ .Release.Namespace }}.svc.cluster.local:8001"}]
    #     initContainers: []
    #     volumes: []
    #     volumeMounts: []
    plugins: []
  # present: the bootstrap Job creates this release's OpenShell sandbox when it
  #   is missing and leaves an existing one unchanged.
  # absent: the bootstrap Job deletes this release's sandbox through the
  #   chart-managed gateway, verifies it is gone, and skips provider and
  #   membership reconciliation. Use it before `helm uninstall` or before an
  #   upgrade that changes the sandbox configuration identity. Requires the
  #   acknowledgement below because active Hermes sessions end.
  sandbox:
    desiredState: present
    dangerousAcknowledgement: ""
  bootstrap:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 600
    authentication:
      # Managed Kubernetes gateways use a short-lived projected ServiceAccount
      # token as the OpenShell OIDC bearer identity. Existing gateways can use
      # clientTLS when their operator has enabled mTLS user authentication.
      mode: serviceAccountToken
      tokenExpirationSeconds: 900
  sanity:
    enabled: false
    command:
      - hermes
      - --version

# Optional in-cluster terminal for the existing Hermes sandbox. The container
# starts a fixed OpenShell sandbox-exec command, so users need only `oc attach`
# or `kubectl attach`; the chart never grants pods/exec access.
operatorClient:
  enabled: false
  # Hermes skill directory names passed as `--skills` to the terminal session.
  skills: []
  tokenExpirationSeconds: 3600
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# NemoClaw quickstart access surfaces. The managed Hermes image serves its
# browser dashboard on port 18789 and its OpenAI-compatible API on port 8642
# inside the OpenShell sandbox network namespace, exactly as `nemohermes`
# forwards them on a workstation. This chart-managed relay performs the same
# `openshell forward service` step in-cluster with a user-scoped projected
# ServiceAccount token, so operators get the dashboard-url, gateway-token, and
# status workflow from the NemoClaw quickstart. Nothing here builds an image.
access:
  enabled: true
  dashboard:
    enabled: true
    # NemoClaw's Hermes dashboard port. Another value sets NEMOCLAW_DASHBOARD_PORT.
    port: 18789
    # Optional browser-facing origin recorded as CHAT_UI_URL for NemoClaw.
    # Empty keeps NemoClaw's loopback default for port-forward access; route
    # and ingress exposure derive it automatically. Must use http:// or https://.
    externalUrl: ""
  api:
    enabled: true
    # NemoClaw accepts 8642 through 8652. Another value sets NEMOCLAW_HERMES_API_PORT.
    port: 8642
  relay:
    # Projected token lifetime. The relay restarts its gRPC forwards shortly
    # before expiry after the kubelet rotates the token.
    tokenExpirationSeconds: 3600
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  exposure:
    # none: ClusterIP only. Reach both ports like the NemoClaw quickstart with
    #   `kubectl port-forward`; Helm NOTES prints the exact command.
    # route: OpenShift Routes. The dashboard sits behind an OpenShift
    #   oauth-proxy login unless explicitly acknowledged otherwise.
    # ingress: Kubernetes Ingress. nodePort: additional NodePort Service.
    #   Both leave the dashboard without a login and require the
    #   acknowledgement below.
    type: none
    # Hermes 0.19 trusts its loopback dashboard without any login. Set this to
    # I_ACKNOWLEDGE_UNAUTHENTICATED_DASHBOARD only when another control such as
    # an operator-managed authenticating proxy or a private network protects it.
    dashboardUnauthenticatedAcknowledgement: ""
    edge:
      # Public multi-architecture nginx used only when the dashboard leaves the
      # cluster. It enforces same-origin browser requests, then presents the
      # loopback Host and Origin headers Hermes requires. Immutable digest.
      image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
      pullPolicy: IfNotPresent
      dashboardPort: 8080
      apiPort: 8081
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
    nodePort:
      # null lets the API server choose.
      dashboard: null
      api: null
    ingress:
      className: ""
      annotations: {}
      dashboard:
        host: ""
      api:
        host: ""
      # Standard Ingress TLS entries. Any entry switches derived URLs to https.
      tls: []
    route:
      # Empty hosts derive <release>-dashboard.<appsDomain> and
      # <release>-api.<appsDomain>; supply appsDomain or explicit hosts.
      appsDomain: ""
      dashboard:
        enabled: true
        host: ""
      api:
        enabled: true
        host: ""
        tlsTermination: edge
      oauthProxy:
        enabled: true
        # OpenShift oauth-proxy from the public OKD registry, linux/amd64
        # manifest list. Override with `oc adm release info --image-for=oauth-proxy`
        # on other architectures or disconnected clusters.
        image: quay.io/openshift/origin-oauth-proxy:4.20@sha256:cbe0037e294783a8b3f72b7232e4c0c78f8bc9c1db2a1eb1b8ff046e451c5768
        pullPolicy: IfNotPresent
        # SubjectAccessReview JSON every login must pass. Empty requires `get`
        # on this release's access Service in the release namespace.
        subjectAccessReview: ""
        # Empty creates and preserves a random cookie-signing Secret.
        cookieSecretRef:
          name: ""
          key: cookie-secret
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi

networkPolicy:
  enabled: true

# Official OpenShell chart. Managed mode installs it; existing mode consumes an
# already-running gateway and requires openshell.enabled=false.
openshell:
  enabled: true
  mode: managed
  existing:
    endpoint: ""
    name: existing-openshell
    clientTLSSecretName: openshell-client-tls
  image:
    repository: ghcr.io/nvidia/openshell/gateway
    pullPolicy: IfNotPresent
    tag: "0.0.116@sha256:05cf77bbb022a739aed6f22daa0e7e164415f4ab273b5f84319e46d91eb8f645"
  supervisor:
    image:
      repository: ghcr.io/nvidia/openshell/supervisor
      pullPolicy: IfNotPresent
      tag: "0.0.116@sha256:c8c42aef16c200063e32cbf72e553e4ead027085427b555efafd95063ecead42"
    sideloadMethod: init-container
    topology: combined
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  sandboxServiceAccount:
    create: true
    annotations: {}
    name: ""
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  agentSandbox:
    preflight:
      enabled: true
  networkPolicy:
    enabled: true
  service:
    type: ClusterIP
    port: 8080
    healthPort: 8081
    metricsPort: 9090
  server:
    openshift:
      gatewayUid:
        enabled: false
        offset: 1
        value: null
      # Managed OpenShift installs assign Hermes a namespace-valid UID that is
      # distinct from both the SCC range start and the long-lived gateway UID.
      sandboxUid:
        enabled: false
        offset: 2
        # Explicit values are for deterministic offline rendering only. Leave
        # null on a live cluster so Helm resolves the release Namespace range.
        value: null
    telemetryEnabled: true
    sandboxNamespace: ""
    sandboxImage: ghcr.io/nvidia/nemoclaw/hermes-sandbox@sha256:bcc2704ae28755fa0b9a1b5314f9438e614ca7a87e26ee401f32e3b6ecdf427d
    sandboxImagePullPolicy: IfNotPresent
    workspaceDefaultStorageSize: 5Gi
    workspaceStorageClass: ""
    defaultRuntimeClassName: ""
    enableUserNamespaces: false
    appArmorProfile: Unconfined
    policyValidationFailureMode: fail_closed
    drivers:
      kubernetes:
        workspaceMode: shared
    auth:
      allowUnauthenticatedUsers: false
    # The Kubernetes API ServiceAccount issuer is the portable default for
    # bootstrap authentication. Override issuer on clusters that publish a
    # different value from /.well-known/openid-configuration.
    oidc:
      issuer: https://kubernetes.default.svc
      # The official gateway image is Debian-based and exposes this public CA
      # bundle. The vendored OpenShell chart combines it with kube-root-ca.crt
      # via SSL_CERT_DIR, so private OIDC and public model endpoints both
      # remain verified.
      systemCaBundlePath: /etc/ssl/certs/ca-certificates.crt
      audience: openshell-cli
      jwksTtl: 3600
      # Kubernetes ServiceAccount tokens expose audiences as an array. The
      # lifecycle Job requests both values below for short-lived admin work;
      # the optional operator client receives only the user audience.
      rolesClaim: aud
      adminRole: openshell-admin
      userRole: openshell-cli
      scopesClaim: ""
      caConfigMapName: kube-root-ca.crt
    tls:
      certSecretName: openshell-server-tls
      clientCaSecretName: openshell-server-client-ca
      clientTlsSecretName: openshell-client-tls
    credentialStorage:
      existingSecret: ""
    credentialDrivers:
      kubernetesSecrets:
        enabled: false
        namespace: ""
        allowReferenceNamespace: false
        rbac:
          create: true
      vault:
        enabled: false
        address: ""
        mount: secret
        kvVersion: "2"
        authMethod: kubernetes
        role: ""
        kubernetesAuthMount: kubernetes
        serviceAccountTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
        tokenPath: ""
        timeoutSecs: ""
  pkiInitJob:
    enabled: true
    serverDnsNames: []
    serverIpAddresses: []
  certManager:
    enabled: false
  openshiftRoute:
    enabled: false
