# NeMo Compass config. Run from the example root and set the time window (UTC) of the
# runs to analyze on the command line (README Step 3), for example:
#   insight-agent --config analyst.yaml --trace.intake.query.started-at-gte <start> \
#     --trace.intake.query.started-at-lte <end>
max_tokens: 16384
# The agent's own configuration, so findings can be checked against it.
code_base: agent
trace:
  max_traces: 100
  intake:
    base_url: http://localhost:8080
    workspace: default
    query:
      agent_name: cad-agent
      started_at_gte: '2026-09-24T00:00:00Z'
      started_at_lte: '2026-09-25T00:00:00Z'
compass_signals:
  ethos_divergence:
    ethos_path: ETHOS.md
  # Needs an embedding model; this example has no user conversations to analyze.
  user_sentiment: false
