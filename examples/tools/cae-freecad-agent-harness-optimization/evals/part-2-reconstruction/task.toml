schema_version = "1.3"
# The agent runs in the task container (harness/cad_agent.py) and saves its model
# here. Harbor hands only this file to the separate verifier.
artifacts = ["/app/model.FCStd"]

[metadata]
category = "cad"
tags = ["freecad", "parametric-modeling", "mesh-reconstruction"]

[agent]
# The agent itself is stopped after CAD_AGENT_TIMEOUT (300 s); the rest is scoring.
timeout_sec = 600.0
# The agent reaches only the NeMo Helix inference gateway and Intake on the host.
network_mode = "allowlist"
allowed_hosts = ["host.docker.internal"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
# A heavy FreeCAD call fails this trial instead of exhausting the Docker VM shared
# by the parallel trials.
memory_mb = 4096
