schema_version = "1.3"
# The agent runs in the task container (harness/cad_agent.py) and saves its model
# here. Harbor hands only this file to the separate verifier.
artifacts = ["/app/model.FCStd"]

[metadata]
category = "cad"
tags = ["freecad", "parametric-modeling", "mesh-reconstruction"]

[agent]
# A hard stop after the agent's own CAD_AGENT_TIMEOUT, which lets the trace flush; room
# for a limit raised up to 30 minutes.
timeout_sec = 2040.0
# The agent reaches only the NeMo Helix inference gateway and Intake on the host.
network_mode = "allowlist"
allowed_hosts = ["host.docker.internal"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
os = "linux"
# A heavy FreeCAD call fails this trial instead of exhausting the Docker VM shared
# by the parallel trials.
memory_mb = 3072

[environment.env]
# The run limit in seconds (5 minutes; the published results use it). Keep it below
# [agent] timeout_sec minus about 240 s (the trace upload may take 180 s), or Harbor stops
# the agent before its trace is sent.
CAD_AGENT_TIMEOUT = "${CAD_AGENT_TIMEOUT:-300}"
# NeMo Helix as the container reaches it. The agent's network allows only
# host.docker.internal: for Helix on another host, change allowed_hosts above too.
CAD_HELIX_URL = "${CAD_HELIX_URL:-http://host.docker.internal:8080}"
NHX_WORKSPACE = "${NHX_WORKSPACE:-default}"
