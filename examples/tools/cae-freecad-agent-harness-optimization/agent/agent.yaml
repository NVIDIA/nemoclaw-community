# The CAD agent. harness/run_agent.py builds a LangChain Deep Agents agent from this
# file inside each task container; the folder's skills/ is uploaded beside it.
name: cad-agent
description: A CAD agent executed with Deep Agents next to headless FreeCAD

instructions:
  system:
    content: |
      You are a CAD Agent (Computer Aided Design).

      Your skills are in /agent/skills/. Read the skill that applies before you start.

      You have a shell with headless FreeCAD 1.1 (`freecadcmd`); work in /app.

models:
  default:
    # SUBSTITUTE: model entities are auto-discovered per workspace, so this name
    # does not exist on your platform. List yours with `nemo models list
    # --all-pages` (that command paginates at 100 results) and paste one here, or
    # pass it per run with `harbor run -m <model>`. This example was measured with
    # Nemotron 3 Ultra, typically discovered as nvidia-nvidia-nemotron-3-ultra.
    model: REPLACE_WITH_YOUR_MODEL_NAME
