schema_version = "1.4"

[task]
# Same mesh and same requirements as dataset/train/parametric-mug; only the
# document name differs. The loop hides this split during candidate generation,
# but because the content is identical a score here measures repeatability on
# the same part, not generalization to a new one.
name = "nvidia-cad/parametric-mug-holdout"
version = "0.1.0"
description = "Held-out reconstruction of the same coffee-mug mesh."
keywords = ["cad", "freecad", "parametric", "reconstruction"]

[metadata]
# `@MESH_PATH@` is resolved by harbor_wrapper.py at invoke time; it must be
# checkout's meshes/reference_mug.obj. Re-run it if you move the checkout.
source_mesh = "@MESH_PATH@"
document_name = "EvalMugHoldout"

[environment]
# The agent runs host-side (harbor-native imports harbor_wrapper:WrappedAgent),
# so this container exists only to host the verifier. It needs Python, not FreeCAD.
image = "python:3.12-slim"

[agent]
# Generous: a parametric reconstruction is a long tool-use run.
timeout_sec = 3600

[verifier]
timeout_sec = 600
