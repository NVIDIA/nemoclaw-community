- name: Off-axis section measurements are ignored when choosing the revolution axis
  description: The agent builds origin-axis revolutions even when original mesh sections
    place the shape off local z. One cup has section centers near (21.1,21.1), but
    its first saved revolve is centered at (0,0); a subsequent world-space left-multiplied
    body translation leaves final IoU 0.0000. Another off-axis thin shell is interpreted
    as a round part and revolved about local z, producing a donut; its replacement
    fails and the final saved-file IoU is 0.0316. Validate the measured centerline
    and rotational symmetry before choosing a revolve, and compose translations in
    the measured local frame rather than treating local offsets as world coordinates.
    The shared failure is axis/pose validation, not proof that the classifier or translation
    alone caused every geometric defect.
