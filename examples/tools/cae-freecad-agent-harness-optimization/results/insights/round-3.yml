- name: High-overlap reconstructions still omit required features
  description: Two completed bracket reconstructions have saved-file IoU above 0.93
    yet fail the separate no-missing-feature evaluation. Final numerical read-backs
    also show localized mesh-only material. In one run, the agent recognized sloped
    support geometry but delivered rectangular walls and a non-cutting hole pocket;
    in the other it delivered an L-pad and hole pockets while dismissing missing corner
    reinforcement as taper or faceting. High aggregate overlap is not a feature-completeness
    check. Track each measured support, hole and cavity through the final feature
    tree and inspect localized residuals rather than waiving them after IoU passes.
    The evaluator does not identify which individual omission caused its failure.
