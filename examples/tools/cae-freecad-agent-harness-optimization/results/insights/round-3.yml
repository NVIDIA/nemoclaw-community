- name: Generic mesh slicing produces dense loft trees instead of design-intent CAD
    features
  description: Editable, fully parametric reconstruction requests are routed to the
    same generic axis-slicing helper. It turns each mesh into four AdditiveLofts driven
    by 24–27 B-spline section sketches and ties section heights to the single `Params.Length`
    dimension; the final responses confirm this same structure. Although the files
    are valid and closely match the mesh, this slice-derived tree degrades designer
    editability and does not reconstruct geometry with appropriate revolutions, extrusions,
    holes, ribs, or other design-intent features. Replace the one-size-fits-all helper
    path with geometry classification and feature-specific, constrained reconstruction
    strategies.
