- name: Failed loft refinements leave earlier, acknowledged-wrong deliverables
  description: After recognizing that a saved approximation has the wrong shape, the
    agent attempts loft replacements that fail to construct valid geometry, then finishes
    with the earlier incorrect artifact. A tube-like mesh remains an elliptical lens
    after two polygonal subtractive-loft attempts fail with NullObject; the final
    read-back still has the earlier volume 32326.6 and IoU about 0.263. A spoon/bulb
    remains an origin-axis donut after its loft replacement produces multiple solids
    and self-intersections; the final verifier confirms the old revolve. Preserving
    a valid checkpoint prevents corruption but does not complete the reconstruction.
    Validate section ordering, containment and intersections before full loft builds,
    and budget time for an alternate complete construction rather than repeated failing
    refinements. No single underlying OCC cause is established.
