- name: Saved FreeCAD models contain multiple visible objects despite success claims
  description: For requests that require `/app/model.FCStd` to open with exactly one
    visible object, the mesh-to-PartDesign workflow saves and reopens files with `Body`,
    `Origin001`, and `Loft04` visible. Even the run that tried to repair visibility
    still read back both `Body` and `Loft04` as visible, yet the agent reported that
    only the Body was visible. Update the save/repair logic to hide every non-final
    object's ViewObject, reopen the saved file, count visible objects, and withhold
    the success claim unless the count is exactly one.
