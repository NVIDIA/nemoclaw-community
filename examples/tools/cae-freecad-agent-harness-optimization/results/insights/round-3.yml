- name: Structurally valid deliverables still fail the mesh-fidelity target
  description: 'Mesh-to-FreeCAD runs terminate with a saved, reopenable single solid
    even though the final numerical verifier reports IoU below 0.9 and the saved-file
    evaluator fails mesh-fidelity. Structural validity and aggregate volume are not
    sufficient acceptance criteria: one finished tube has volume ratio 0.9996 but
    IoU about 0.40, and another is reported as meeting all hard requirements at IoU
    about 0.88. Gate completion on geometric fidelity and reserve time to correct
    the localized missing/extra material; do not equate a valid saved solid with a
    faithful reconstruction.'
