- name: Named size edits are inert or produce invalid rebuilds
  description: The final saved-model verifier finds named size controls whose +10%
    edits change neither measured volume nor bounds, or named controls whose edits
    invalidate the rebuild. Thickness is inert in the prismatic plate; WallHeight
    and HoleDiam are inert and PartHeight rebuilds invalidly in the six-hole plate.
    The six-hole plate is nevertheless presented as having independently working dimensions.
    Bind designer dimensions to the correct sketch and feature expressions and require
    valid, nontrivial size responses before declaring parametric editability. Zero
    volume/bounds response of positional hole controls alone is not evidence of an
    inert parameter.
