- name: Section-heavy loft models fail the compact-model requirement
  description: Two delivered models used 32–38 section sketches and 75–83 faces and
    were rejected by the evaluator's compact-model check, while the agent treated
    any count in the tens as acceptable. The reconstruction workflow should use the
    contract's reference-relative compactness criterion and simplify the feature tree
    before delivery.
