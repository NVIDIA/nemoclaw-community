- name: PartDesign Loft retries omit the initial Profile link
  description: When building PartDesign::Loft from multiple sketches, the agent repeatedly
    sets loft.Sections without assigning the initial loft.Profile. The same executed
    programs report "Failed to get shape of Profile" and null or invalid shapes. Retrying
    body membership, section formats, and sketch constraints preserves this missing
    link; later experiments in one run also try a list of sketches as Profile and
    receive a type error. No successful reconstruction recovery is recorded, and both
    checked runs fail the scored native-model requirements. Supply a validated Loft
    helper that assigns the first sketch to Profile and subsequent sketches to Sections,
    checks shape validity after recompute, and stops retries that leave the same profile-link
    failure unchanged. This is a specific linking misuse, not evidence that lofting
    is unavailable or that it explains every failed grading check.
