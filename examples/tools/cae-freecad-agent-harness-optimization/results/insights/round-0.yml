- name: FreeCAD model construction stalls in repeated failing API experiments
  description: The agent repeatedly switches from building the requested artifact
    to isolated experiments for sketch attachment, constraints, origin/datum planes,
    spreadsheet parameters, and expressions. These experiments produce invalid-cell,
    missing-attribute, expression, and process-termination failures, yet the agent
    continues probing until the run ends without a successful save of `/app/model.FCStd`.
    The two runs finish with blank or progress-only output and evaluation records
    IoU 0.0, reward 0.0, and every acceptance check failing. Provide a tested, version-compatible
    PartDesign construction template or helper library, cap exploratory API retries,
