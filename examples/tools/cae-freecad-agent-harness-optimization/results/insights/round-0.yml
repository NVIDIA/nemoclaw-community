- name: Mesh-analysis runs end without a completed scored CAD deliverable
  description: During mesh-to-parametric-FreeCAD tasks, the agent repeatedly executes
    numerical reference-mesh analysis and ends with further measurements rather than
    a demonstrated reconstruction saved to /app/model.FCStd. The checked examples
    finish by rechecking the stepped tube's radial transitions or fitting the bent
    tube's centerline and wall thickness; they show no tool input targeting the scored
    model file. Their completed runs receive reward 0 and fail native-feature-tree,
    named-dimension, and reopen/recompute checks. Reference measurements are not numerical
    verification of an editable model. Add an explicit analysis-to-construction checkpoint
    and reserve execution budget for saving, reopening, and testing the requested
    file. The traces establish noncompletion, not why execution stopped or individual
    defects in an inspected final file.
