- name: Four-argument Sketcher Radius experiments repeatedly fail without model delivery
  description: In circle-constraint experiments during parametric reconstruction,
    the agent uses four-argument Sketcher.Constraint("Radius", geometry_index, point_position,
    radius) calls, including (0, -1, 20.0) and (0, 2, 10.0). Multiple separately executed
    experiments return "Unknown exception while processing file" and native crash
    backtraces; the first run explicitly reports SIGSEGV. Changing sketch placement
    or using list-form addConstraint does not produce a completed model, and both
    runs receive reward 0 with failed native-feature-tree, driving-dimension, and
    reopen checks. Use a validated three-argument Radius helper and a minimal constraint
    smoke test before full construction, and inspect substantive FreeCAD exceptions
    even when shell pipelines return exit code 0. The traces associate these constructor
    attempts with failed experiments; they do not identify the sole native-crash cause
    or show all Sketcher operations to be unstable.
