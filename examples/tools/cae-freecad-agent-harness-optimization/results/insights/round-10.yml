- name: Full-pass grading accepts named dimensions that do not drive geometry
  description: The final saved models can register a named design parameter whose
    ±10% verification produces zero or effectively zero geometric change, yet the
    evaluator still records reward=1 and failed-checks='none'. This occurs for WallThickness
    and SmallFloor and violates the primary requirement that every named dimension
    change the part in its own way. Make a no-op registered parameter a failed check
    (or remove it before saving) rather than allowing other working parameters to
    satisfy the aggregate dimension test.
