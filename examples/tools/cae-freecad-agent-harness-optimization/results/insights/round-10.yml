- name: Full-pass grading accepts height parameters that break recompute
  description: The final saved FreeCAD models can register Height or BodyHeight even
    though the required ±10% perturbation check says that changing it breaks the part,
    while the evaluator still records reward=1 and failed-checks='none'. The nominal
    model reopens, but a designer cannot safely edit this core named dimension, so
    the delivered model fails the task's parametric-editability requirement. Fail
    evaluation whenever either perturbation does not leave one clean solid, and require
    the agent to drive dependent feature placement from the height parameter before
    reporting completion.
