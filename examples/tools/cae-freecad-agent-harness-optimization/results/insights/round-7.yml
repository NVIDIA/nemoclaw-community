- name: Saved named dimensions fail independent edit tests
  description: The last saved-file verification before termination exposes named dimensions
    that either produce no volume or bounding-box response to a +10% edit or invalidate
    the rebuilt shape. For example, HoleDia and HoleDiameter remain inert in the plate
    reconstructions, and LeftX invalidates the scoop model. These failures occur even
    when the unedited file is a valid single solid; naming parameters and constraining
    sketches does not establish editable design intent. Require each advertised dimension
    to pass an independent perturbation-and-recompute test, repair its geometry/expression
    binding, and rerun the test after the final save.
