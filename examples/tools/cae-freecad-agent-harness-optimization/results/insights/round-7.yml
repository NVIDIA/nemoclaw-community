- name: Runs end without saving a FreeCAD baseline
  description: The mesh-to-FreeCAD workflow ends without creating /app/model.FCStd,
    despite instructions to save a valid baseline by about minute two. One run remains
    in repeated mesh surveys without executing a model build; another repeatedly fails
    before persistence, while its successful diagnostic pads remain unsaved. Both
    start without the artifact and finish with all saved-model checks failing. Enforce
    a build-and-save checkpoint before further surveys or feature debugging, and save
    a simple valid fallback as soon as a diagnostic build succeeds.
