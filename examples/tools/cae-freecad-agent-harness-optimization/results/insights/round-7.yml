- name: Verified low-fidelity CAD models remain the final deliverables
  description: During mesh reconstruction, verify.py reports a valid single solid
    but an IoU below the documented 0.9 target; terminal evaluation of the submitted
    file still fails mesh fidelity. Structural validity is being treated as an adequate
    stopping point despite unresolved geometric mismatch, including solid-filled hollow
    regions and simplified or omitted features. Keep a valid baseline for safety,
    but prioritize the verifier’s missing/extra-material measurements and recheck
    geometric fidelity after each repair rather than treating a valid save or near-unit
    volume ratio as completion.
