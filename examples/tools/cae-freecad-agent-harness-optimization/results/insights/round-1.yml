- name: Agent delivers a model despite its own severe mesh-fidelity warning
  description: In two runs on the complex 18,988-facet mesh, the final 47-pad model
    reopened as one valid solid and had a near-matching volume ratio of 0.972, but
    the agent's own section check reported IoU 0.229. The agent nevertheless left
    that model for delivery; the evaluator later measured IoU 0.7803, failed mesh-fidelity,
    and assigned reward 0. Treat a sub-threshold fidelity check as a delivery blocker
    and switch reconstruction strategy rather than relying on volume and bounding-box
    agreement.
  evidence:
  - trace_id: 01a1414d-36be-7602-a646-5f991878edae
