- name: Mesh conversion always emits a dense stack of slice sketches and pads
  description: For every mesh, the agent uses the same band-slicing helper rather
    than selecting geometry-appropriate PartDesign features. The delivered files contain
    32–47 sketches/features and 1,214–1,668 sketch elements, with tool output explicitly
    describing successive bands merged from slices. This produces bloated, difficult-to-edit
    models and, on the complex mesh, still does not preserve fidelity. Add geometry
    classification and construct compact revolves, extrusions, lofts, or sweeps instead
    of defaulting to one sketch/pad per slice.
