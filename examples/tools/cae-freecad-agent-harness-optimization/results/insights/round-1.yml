- name: Build exceptions remain unrecovered before delivery
  description: Executed FreeCAD build scripts abort before their save step, and the
    runs reach neither a successful save nor saved-file verification. Observed exceptions
    include an invalid spreadsheet alias, reversed ellipse-axis lengths, and arithmetic
    mixing floats with expression strings. Two runs edit or rewrite the script after
    failure without executing the final repair; the other stops at its build exception.
    Final evaluations report zero reward and all deliverable checks failed, not nine
    independently diagnosed artifact defects. Require rerunning repaired scripts and
    confirming a saved, reopened model before completing the workflow.
