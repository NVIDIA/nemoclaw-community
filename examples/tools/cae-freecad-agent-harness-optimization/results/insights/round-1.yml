- name: Late reconstruction retries exhaust the run and prevent the final verification
    report
  description: After successfully saving and numerically verifying a model, the agent
    starts another mesh reconstruction with only 1–9 seconds left in the run. That
    final execute call has no result in all four traces, and the agent then returns
    only whitespace instead of the required numerical verification. Reserve time for
    the final response and stop launching expensive reconstruction retries near the
    execution deadline.
