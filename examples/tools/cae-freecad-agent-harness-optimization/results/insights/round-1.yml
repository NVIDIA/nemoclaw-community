- name: Subtractive loft failures are saved instead of rejected
  description: Adding a cavity loft changes a valid, positive-volume outer solid into
    invalid geometry or an empty result, yet K.finish saves /app/model.FCStd after
    reporting a failed full shape check. One final save contains one solid with valid=False;
    another contains zero solids and zero volume despite valid=True. The saved-file
    evaluations fail single-valid-solid, and no corrected deliverable is recorded.
    Gate saving on exactly one non-null, positive-volume valid solid passing check(True),
    and retain a known-good file when subtraction fails.
