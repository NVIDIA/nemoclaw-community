- name: Valid saved solids still fail mesh fidelity and feature coverage
  description: 'Saved FreeCAD builds report one valid solid, no feature errors and
    a successful full shape check, but the final saved-file evaluations still fail
    mesh-fidelity and no-missing-feature. Reviewed IoUs range from 0.0012 to 0.6742.
    These are not transient build errors: the low-fidelity files remain the evaluated
    deliverables after any refinement. Coarse outer/cavity lofts are recurring examples;
    a partial revolution also produces a severe mismatch. Treat solid validity as
    only one checkpoint: numerically compare the saved geometry with the reference,
    localize missing and extra material, and reserve time to correct discrepancies
    before delivery.'
