- name: Saved FreeCAD models leave helper objects visible
  description: 'The saved model violates the requirement that only the finished model
    be visible on reopen: the script''s own read-back lists Body, Origin001, and Loft04,
    and a later inspection also exposes origins, axes, planes, and Params. The agent
    does not repair and re-save visibility state, and some final responses incorrectly
    claim only Body is visible. Explicitly hide all helper and origin objects, persist
    the file, then reopen it and assert that the finished Body is the sole visible
    object.'
