- name: Saved models pass solidity but fail required mesh fidelity
  description: The mesh-to-FreeCAD workflow leaves structurally valid saved models
    whose final saved-file evaluations fail mesh-fidelity and score below 0.9 IoU.
    Original verifier comparisons confirm the mismatch. In observed recovery attempts,
    a tapered strip/block becomes a rectangular pad with a volume ratio of 6.00, a
    ladle keeps its outer body without its cavity at a ratio of 3.23, and a mug keeps
    an approximate handle despite near-perfect volume agreement. Passing solidity,
    reopening, or volume checks is being used as a stopping point without recovering
    the required geometric match. Make fidelity an independent acceptance gate for
    the final saved file and retain the best verified overlap when a later build fails.
