- name: Named-dimension edits invalidate otherwise valid saved models
  description: 'The saved-file verifier reopens valid single-solid models but reports
    invalid geometry after +10% edits to named dimensions: Width in the bracket, CavityHeight
    in the bossed elliptical shell, HandleCX1 in the mug, and HeadLength or TongueZCenter
    in the spoon. These failures remain in the latest captured perturbation tests;
    fully constrained sketches and named spreadsheet aliases do not establish independent,
    usable rebuilding. Some final reports still assert that all named dimensions keep
    the model valid. Validate parameter dependencies and supported edit ranges, prevent
    edits that detach features or invalidate cavities, and report perturbation failures
    instead of blanket parametric-success claims. This claim excludes zero-volume/bounding-box
    changes alone, since legitimate position edits can preserve both.'
  evidence:
