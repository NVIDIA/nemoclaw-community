# NeMo Compass Insights, round 4
# Agent: r4-shapes (kept in round 3). Its 20 train runs, one per task. Rounds 5 and 6 reused these Insights.
# Raw Compass output; only names and paths are neutralised.
- name: Self-intersecting loft builds reach evaluation without verified recovery
  description: 'Two section-loft runs report BOPAlgo SelfIntersect from actual executed
    K.finish calls and finish with a failed single-valid-solid evaluation. The elliptical
    lens reports two solids despite isValid=True; the long spoon-like body reports
    one solid and isValid=True but fails the full BOP check. Later replacement scripts
    or plans do not establish recovery: no subsequent successful executed build or
    full-check verifier result is recorded, and the last verifier calls have no captured
    result. Enforce check(True) as well as solid count, prioritize a verified safe
    checkpoint within the time budget, and require execution plus saved-file verification
    of a replacement rather than treating a written script as a repair. The traces
    do not distinguish an absent final file from an invalid one.'
