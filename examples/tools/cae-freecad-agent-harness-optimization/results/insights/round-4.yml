- name: Fixed mesh reconstruction fails independent design-intent dimensions
  description: For requests that explicitly require multiple independently editable,
    design-intent dimensions, the agent delegates modeling to the fixed mesh2pd axial-loft
    script and validates only the single Params.Length parameter, which stretches
    all section heights together. The evaluator records `failed-checks=independent-dimensions`
    and reward 0 even though the agent reports the model as meeting the requirements.
    Replace or augment this generic reconstruction with part-specific features and
    separate named dimensions, and test that each parameter changes only its intended
    feature.
