- name: Feature completeness is not enforced on the final saved solid
  description: Saved sketch-based reconstructions pass the single-valid-solid check
    while their final evaluations fail no-missing-feature. Concrete unrepaired omissions
    include six mounting holes whose Pocket does not cut the first L-bracket, a side
    tab/boss identified in the second bracket's measurements and render, and a ladle
    cavity excluded from the last valid save. Both brackets exceed 0.9 evaluated IoU,
    so aggregate overlap alone cannot detect these missing features. Track a feature
    inventory from the section survey and verify that each feature actually changes
    the final solid before reporting completion; a nominal feature-tree entry is not
    enough.
