name: Feature request
description: Suggest an improvement
type: Enhancement
labels: ["needs: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use a concise title such as `feat(gitlab): add policy-scoped read access`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives did you consider?
