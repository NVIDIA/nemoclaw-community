name: Governance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  taxonomy:
    name: Validate maintainer taxonomy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate taxonomy
        run: python3 scripts/check_label_taxonomy.py --check

      - name: Run governance tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_governance_*.py'

      - name: Check pull request title (advisory)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py --advisory "$PR_TITLE"
